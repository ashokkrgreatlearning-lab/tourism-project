name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - "deployment/best_tourism_model_v1.joblib"
      - "deployment/model_config.json"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  # =====================================================
  # JOB 1: REGISTER DATASET
  # =====================================================

  register-dataset:
    name: Register Tourism Dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas==2.2.2

      - name: Verify Dataset
        run: |
          test -f data/tourism.csv

      - name: Register Dataset
        run: |
          python model_building/data_register.py

      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: data/tourism.csv
          if-no-files-found: error

  # =====================================================
  # JOB 2: DATA PREPARATION
  # =====================================================

  data-prep:
    name: Prepare Tourism Dataset
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas==2.2.2 scikit-learn==1.6.1

      - name: Download Registered Dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-data
          path: data

      - name: Run Data Preparation
        run: |
          python model_building/prep.py

      - name: Verify Prepared Datasets
        run: |
          test -f data/Xtrain.csv
          test -f data/Xtest.csv
          test -f data/ytrain.csv
          test -f data/ytest.csv

      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            data/Xtrain.csv
            data/Xtest.csv
            data/ytrain.csv
            data/ytest.csv
          if-no-files-found: error

  # =====================================================
  # JOB 3: MODEL TRAINING AND MLFLOW
  # =====================================================

  model-training:
    name: Train XGBoost Model
    needs: data-prep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r deployment/requirements.txt
          python -m pip install mlflow==3.0.1

      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: data

      - name: Verify Training Files
        run: |
          test -f data/Xtrain.csv
          test -f data/Xtest.csv
          test -f data/ytrain.csv
          test -f data/ytest.csv

      - name: Train XGBoost Model
        run: |
          python model_building/train.py

      - name: Verify Trained Model
        run: |
          python -c "import os; p='deployment/best_tourism_model_v1.joblib'; assert os.path.isfile(p) and os.path.getsize(p)>0, 'Model missing or empty'; print('Model verified:', p)"
          test -f deployment/model_config.json

      - name: Upload Trained Model
        uses: actions/upload-artifact@v4
        with:
          name: trained-tourism-model
          path: |
            deployment/best_tourism_model_v1.joblib
            deployment/model_config.json
          if-no-files-found: error

      - name: Upload MLflow Experiments
        uses: actions/upload-artifact@v4
        with:
          name: tourism-mlflow-experiments
          path: mlruns/
          if-no-files-found: error

      - name: Commit Trained Model to GitHub
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f \
            deployment/best_tourism_model_v1.joblib \
            deployment/model_config.json

          if git diff --cached --quiet; then
            echo "No model changes to commit."
          else
            git commit -m "Update trained tourism model [skip ci]"
            git push origin HEAD:main
          fi
